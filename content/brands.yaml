    Graanvrij is geen keurmerk. Een kat heeft geen granen nodig, maar een beetje granen is voor de meeste gezonde katten ook geen probleem. Wat telt, is dat het voer compleet is en dat je kat het goed verdraagt. Kies Edgard & Cooper dus omdat je het etiket en de smaak goed vindt, niet alleen vanwege het woord graanvrij. Meer daarover lees je bij [graanvrij kattenvoer](/graanvrij-kattenvoer/).

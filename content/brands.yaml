    ## Is Edgard & Cooper kattenvoer de prijs waard?

    Edgard & Cooper verkoopt vooral een gevoel: vers vlees, geen granen, een vrolijke kat op de verpakking. Ik kijk liever naar wat er overblijft als je de verpakking omdraait. En dat is eerlijk gezegd netjes. De meeste recepten noemen de vleessoort bij naam en het merk heeft aparte lijnen voor kittens en senioren.

